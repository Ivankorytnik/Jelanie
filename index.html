<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070c">
  <meta name="description" content="Желание сквозь Вселенную: персональное послание, EEG-отпечаток и цифровой сигнал для будущего сеанса космической радиопередачи.">
  <title>Желание сквозь Вселенную</title>
  <link rel="canonical" href="https://spacewish.agency/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c}
    #prod-loading{position:fixed;inset:0;display:grid;place-items:center;background:#05070c;color:#fff;font:16px system-ui;z-index:1}
    #prod-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070c;opacity:0;transition:opacity .12s ease;z-index:2}
  </style>
</head>
<body>
  <div id="prod-loading">Загрузка…</div>
  <iframe id="prod-frame" src="prod-release-20260909/test/" title="Желание сквозь Вселенную"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('prod-frame');
      const loading = document.getElementById('prod-loading');
      let observer;

      function cleanProductionView() {
        try {
          const doc = frame.contentDocument;
          if (!doc) return false;

          doc.title = 'Желание сквозь Вселенную';
          doc.querySelectorAll('.test-stand-badge,.test-inline-label').forEach((node) => node.remove());
          doc.querySelectorAll('link[rel~="icon"]').forEach((node) => node.setAttribute('href', '../favicon.svg'));

          doc.querySelectorAll('.application-success p').forEach((node) => {
            if (node.textContent && node.textContent.includes('тестовом режиме')) {
              node.textContent = 'Контактные данные сохранены в этом браузере. Отправка в CRM или на корпоративную почту пока не подключена.';
            }
          });

          if (!observer && doc.body) {
            observer = new MutationObserver(() => cleanProductionView());
            observer.observe(doc.body, {subtree:true, childList:true});
          }

          if (doc.querySelector('.site-header')) {
            loading.remove();
            frame.style.opacity = '1';
            return true;
          }
        } catch (error) {
          console.warn('Production release cleanup skipped', error);
        }
        return false;
      }

      frame.addEventListener('load', cleanProductionView);
      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        if (cleanProductionView() || attempts > 40) clearInterval(timer);
      }, 250);
    })();
  </script>
</body>
</html>
